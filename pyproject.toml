[project]
name = "intrusioncopilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anant Kumar", email = "antansh42@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-groq>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5.0",
    "streamlit>=1.38.0",
    "tensorflow>=2.16.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=2.1.0",
]

[project.scripts]
intrusioncopilot = "intrusioncopilot:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
